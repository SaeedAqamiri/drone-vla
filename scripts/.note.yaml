summary: >-
  Operational scripts for PX4/Gazebo and visual-localization tooling: `scripts/record_map.py`
  records keyframe maps from the live camera plus truth; `scripts/eval_localizer.py` runs holdout
  evaluation; `scripts/uav_visloc_pairs.py` crops UAV-VisLoc satellite/aerial pairs;
  `scripts/gz_truth_bridge.py` and `scripts/gz_latest_frame.py` bridge Gazebo pose/camera;
  `scripts/flight_log.py`/`gz_flight_logger.py` log flights. The UAV-VisLoc pair script is now
  legacy: navlab/lab/tiles.py rebuilds metric north-up tiles and supersedes its manual offsets.
