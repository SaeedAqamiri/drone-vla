summary: >-
  Reproducible visual-localization lab. Core pieces: tiles.py
  (build_tiles_along_route/build_tiles_in_bbox/TileStore/ReferenceStore, local-CRS north-up warping
  with calculate_default_transform), sequences.py (uav_visloc_queries, frame_folder_queries,
  video_queries with telemetry/has_truth), matchers.py (ClassicalMatcher + get_matcher for
  sift/orb/akaze/loftr/lightglue), deep.py (DeepMatcher using kornia LoFTR or DISK+LightGlue),
  candidates.py (Prior + CandidateSelector with global thumbnail bootstrap and spatial radius),
  runner.py (LabRunner/RunnerConfig with scale/jump/coverage/confirmation gates and position
  refinement from homography), metrics.py/report.py (fix rate, precision, false-fix, p95 error,
  latency, recovery; summary/results/frames/report), and
  generate.py/references.py/bench.py/synthetic.py/cli.py. Synthetic benchmark with SGLang-generated
  references: SIFT/LoFTR/LightGlue all 10/10 fixes, precision 1.0, p95 ~9.7m, LightGlue ~210ms;
  UAV-VisLoc real video still fails due to dataset georeference/oblique limitations.
