summary: >-
  FastAPI/SQLite RTL platform for GPS-denied UAV navigation, now with a reproducible
  visual-localization lab. The original modules remain: web.py routes, models.py schema,
  generation.py backend dispatch, matching.py SIFT wrapper, geo.py route/tile helpers, localizer.py
  keyframe EV, fusion.py KF, and sim.py PX4 SITL/MAVSDK/Gazebo bridges. The new navlab/lab package
  adds metric north-up tile stores, UAV-VisLoc/video/synthetic sequences, classical+deep matcher
  registry, prior-based candidate selection, temporal/scale/jump gating, and CSV/Markdown
  benchmarks. Imagery GSD/rotation handling was fixed, so jobs.py and generation now receive correct
  tile scale and orientation.
