summary: >-
  Satellite-to-aerial reference synthesis and map-matching bake-off.
  `sat2aerial.backends.make_backend` dispatches dummy/ComfyUI/BFL/SGLang/flux3;
  `sat2aerial.matching.match_images` now takes `detector` (sift/orb/akaze) and returns
  `MatchResult.detector`; `sat2aerial.metrics.evaluate_pair` adds edge IoU/SSIM/color;
  `sat2aerial.dataset.load_pairs` accepts subdirectory/flat/manifest layouts. Findings: 2D
  translation preserves top-down layout but not oblique viewpoint; style references help near nadir;
  coverage prevents collinear false positives. Deep matchers now live in navlab/lab/deep.py rather
  than sat2aerial.
