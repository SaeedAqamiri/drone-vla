entries:
  matching.py:
    summary: >-
      Pairwise matcher with selectable detector. `match_images(..., detector='sift')` preprocesses
      with `_prepare` (CLAHE + optional Canny), detects with `_detector(name)` (SIFT/ORB/AKAZE),
      matches with `_matcher(name)` (FLANN kNN for SIFT, BFMatcher Hamming for ORB/AKAZE), estimates
      a RANSAC homography, and computes `_coverage` from the inlier convex hull. Success still
      requires inliers>=15, ratio>=0.15, coverage>=0.03. `MatchResult.detector` records the
      detector. Deep matchers are not in this module; they live in navlab/lab/deep.py.
    confidence: verified
    based_on:
      - sat2aerial/matching.py@7284-1792588473577
      - sat2aerial/types.py@1421-1792566188164
      - sat2aerial/matching.py@7787-1793811114222
      - sat2aerial/types.py@1487-1793811083236
  types.py:
    summary: >-
      `Pair` and `MatchResult` dataclasses. `MatchResult` gained a `detector` field (default 'sift')
      after `success`, and `as_dict()` now includes it; existing named-argument construction remains
      compatible. `Pair` remains the dataset site/satellite/aerials/meta container.
    confidence: verified
    based_on:
