summary: >-
  Deployment scripts for FLUX.3 Klein on the remote H100. `sglang_start.sh` starts `sglang serve
  --model-path /home/ava/flux3-klein/sglang-weights --model-variant fp8r --port 30010
  --batching-max-size 2` with the offline HF cache and the required CUDA/JIT fallback env;
  `sglang_stop.sh`/`status.sh` manage it. `comfy_start.sh` and `comfy_gateway.py` provide the local
  ComfyUI alternative. Live service measured ~3.5s per 768px image on the H100.
