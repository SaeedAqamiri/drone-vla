entries:
  sglang_start.sh:
    summary: >-
      Starts the remote FLUX.3 Klein SGLang service used by `sat2aerial.backends.sglang` and
      `navlab.generation` (`NAVLAB_SGLANG_URL` defaults to http://172.16.20.117:30010). It runs
      `/home/ava/flux3-klein/venv-sglang/bin/sglang serve --model-path
      /home/ava/flux3-klein/sglang-weights --model-variant fp8r --host 0.0.0.0 --port 30010
      --batching-max-size 2 --batching-delay-ms 5`, with HF offline caches and JIT-fallback env. The
      service was started on the H100 and `/v1/models` reports Flux3ImagePipeline; measured ~3.5s
      for one 768px reference and ~13s for four (batch=2).
    confidence: verified
