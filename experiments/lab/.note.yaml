summary: >-
  YAML benchmark configs consumed by `navlab.lab.bench.run_bench`. `uav03_bench.yaml` compares
  satellite vs dummy-generated references across sift/orb/akaze and gray/edges; `synth_bench.yaml`,
  `synth_sglang_bench.yaml`, and `synth_deep_bench.yaml` compare raw satellite, SGLang-generated,
  and ensemble references across classical and deep matchers on the synthetic JP2-crop scene.
  Configs carry store/queries/reference_sets/matchers/modes and a `runner` block for RunnerConfig
  fields.
